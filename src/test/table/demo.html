<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格组件功能演示 | Casting UI</title>
    <link rel="stylesheet" href="/modules/css/core.css">
    <link rel="stylesheet" href="/modules/css/container.css">
    <link rel="stylesheet" href="/modules/css/layout.css">
    <link rel="stylesheet" href="/modules/css/text.css">
    <link rel="stylesheet" href="/modules/css/header.css">
    <link rel="stylesheet" href="/modules/css/animation.css">
    <link rel="stylesheet" href="/modules/css/responsive.css">
    <link rel="stylesheet" href="/modules/css/components.css">
    <link rel="stylesheet" href="/modules/css/status.css">
    <link rel="stylesheet" href="/modules/css/progress.css">
    <link rel="stylesheet" href="/modules/css/input.css">
    <link rel="stylesheet" href="/modules/css/form.css">
    <link rel="stylesheet" href="/modules/css/color-picker.css">
    <link rel="stylesheet" href="/modules/css/table.css">
    <link rel="stylesheet" href="/modules/css/menu.css">
</head>
<body class="CUI-container">
    <div class="CUI-wrap">
        <header>
            <div class="CUI-grid CUI-grid-v-center">
                <div>
                    <h1>表格组件功能演示</h1>
                    <p class="CUI-text--light">动态配置表格 · 冻结 · 提示列 · 多级表头 · 汇总 · 编辑 · 分页 · 排序 · 筛选 · 导出</p>
                </div>
            </div>
        </header>

        <main class="CUI-content">
            <!-- 控制面板 -->
            <section class="CUI-section">
                <h2>控制面板</h2>
                <div class="CUI-grid CUI-grid-4c">
                    <!-- 1. 冻结设置 -->
                    <div>
                        <h3>冻结设置</h3>
                        <div class="CUI-checkbox-group vertical">
                            <label class="CUI-checkbox-item">
                                <input type="checkbox" id="freeze-header" checked>
                                表头冻结
                            </label>
                            <label class="CUI-checkbox-item">
                                <input type="checkbox" id="freeze-footer">
                                表尾冻结
                            </label>
                            <label class="CUI-checkbox-item">
                                <input type="checkbox" id="freeze-first-col">
                                首列冻结（简单模式）
                            </label>
                            <label class="CUI-checkbox-item">
                                <input type="checkbox" id="freeze-last-col">
                                尾列冻结（简单模式）
                            </label>
                        </div>
                        <div style="margin-top: var(--size-sm);">
                            <div class="CUI-checkbox-group vertical">
                                <label class="CUI-checkbox-item">
                                    <input type="checkbox" id="freeze-left-advanced">
                                    左侧提示列（高级模式）
                                </label>
                                <label class="CUI-checkbox-item">
                                    <input type="checkbox" id="freeze-right-advanced">
                                    右侧提示列（高级模式）
                                </label>
                            </div>
                        </div>
                        <div style="display: flex; gap: var(--size-md); margin-top: var(--size-sm);">
                            <div class="CUI-input-group" style="flex: 1;">
                                <label class="CUI-input-label">左侧宽度</label>
                                <input type="number" class="CUI-input" id="left-hint-width" value="80" min="40" max="120">
                            </div>
                            <div class="CUI-input-group" style="flex: 1;">
                                <label class="CUI-input-label">右侧宽度</label>
                                <input type="number" class="CUI-input" id="right-hint-width" value="80" min="40" max="120">
                            </div>
                        </div>
                    </div>

                    <!-- 2. 高级提示列字段选择 -->
                    <div>
                        <h3>提示列字段选择</h3>
                        <div style="margin-bottom: var(--size-sm);">
                            <div class="CUI-text--sm" style="font-weight: 500; margin-bottom: 4px; color: var(--text-primary);">左侧提示列字段</div>
                            <div class="CUI-checkbox-group vertical" id="left-hint-fields">
                                <label class="CUI-checkbox-item"><input type="checkbox" value="ID"> ID</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="姓名"> 姓名</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="性别"> 性别</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="手机号"> 手机号</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="身份证号"> 身份证号</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="邮箱"> 邮箱</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="年龄"> 年龄</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="职位"> 职位</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="薪资"> 薪资</label>
                            </div>
                        </div>
                        <div>
                            <div class="CUI-text--sm" style="font-weight: 500; margin-bottom: 4px; color: var(--text-primary);">右侧提示列字段</div>
                            <div class="CUI-checkbox-group vertical" id="right-hint-fields">
                                <label class="CUI-checkbox-item"><input type="checkbox" value="ID"> ID</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="姓名"> 姓名</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="性别"> 性别</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="手机号"> 手机号</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="身份证号"> 身份证号</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="邮箱"> 邮箱</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="年龄"> 年龄</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="职位"> 职位</label>
                                <label class="CUI-checkbox-item"><input type="checkbox" value="薪资"> 薪资</label>
                            </div>
                        </div>
                    </div>

                    <!-- 3. 显示设置 -->
                    <div>
                        <h3>显示设置</h3>
                        <div class="CUI-checkbox-group vertical">
                            <label class="CUI-checkbox-item">
                                <input type="checkbox" id="display-striped" checked>
                                斑马纹
                            </label>
                            <label class="CUI-checkbox-item">
                                <input type="checkbox" id="display-editable">
                                可编辑单元格
                            </label>
                            <label class="CUI-checkbox-item">
                                <input type="checkbox" id="display-multi-header">
                                多级表头
                            </label>
                            <label class="CUI-checkbox-item">
                                <input type="checkbox" id="display-summary">
                                启用汇总
                            </label>
                            <label class="CUI-checkbox-item">
                                <input type="checkbox" id="display-auto-row-height">
                                自动行高
                            </label>
                        </div>
                    </div>

                    <!-- 4. 分页设置 + 操作按钮 -->
                    <div>
                        <h3>分页设置</h3>
                        <div class="CUI-input-group">
                            <label class="CUI-input-label">每页条数</label>
                            <select class="CUI-select" id="page-size">
                                <option value="10">10 条/页</option>
                                <option value="20">20 条/页</option>
                                <option value="50" selected>50 条/页</option>
                                <option value="100">100 条/页</option>
                            </select>
                        </div>
                        <div style="margin-top: var(--size-sm);">
                            <span class="CUI-text--sm CUI-text--light">当前页码由表格分页器控制</span>
                        </div>
                        <div style="display: flex; gap: var(--size-sm); margin-top: var(--size-lg);">
                            <button class="CUI-btn CUI-btn-primary" id="btn-apply">应用设置</button>
                            <button class="CUI-btn CUI-btn-secondary" id="btn-reset">重置</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 表格区域 -->
            <section class="CUI-section">
                <h2>表格预览</h2>
                <div id="table-area">
                    <!-- 表格由 JS 动态生成 -->
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="/modules/js/index.js"></script>

    <script>
        /* ============================================================
         * 表格组件功能演示 - 控制与渲染逻辑
         * 数据源：/测试用数据/仿真测试数据（JSON格式）.json
         * ============================================================ */

        // 数据源路径
        var DATA_SOURCE = '/测试用数据/仿真测试数据（JSON格式）.json';

        // 单级表头列定义
        var SINGLE_HEADER_COLS = [
            { field: 'ID', label: 'ID', type: 'number', width: '64px' },
            { field: '姓名', label: '姓名', type: 'text', width: '100px' },
            { field: '性别', label: '性别', type: 'text', width: '64px' },
            { field: '身份证号', label: '身份证号', type: 'idcard', width: '180px' },
            { field: '手机号', label: '手机号', type: 'phone', width: '120px' },
            { field: '邮箱', label: '邮箱', type: 'email', width: '200px' },
            { field: '出生日期', label: '出生日期', type: 'date', width: '120px' },
            { field: '年龄', label: '年龄', type: 'number', width: '80px' },
            { field: '职位', label: '职位', type: 'text', width: '120px' },
            { field: '薪资', label: '薪资', type: 'currency', width: '100px' },
            { field: '学历', label: '学历', type: 'text', width: '100px' },
            { field: '专业', label: '专业', type: 'text', width: '120px' },
            { field: '入职日期', label: '入职日期', type: 'date', width: '120px' }
        ];

        // 多级表头行定义（第一行：分组标题，第二行：数据字段）
        var MULTI_HEADER_ROWS = [
            [
                { label: 'ID', colspan: 1, field: 'ID', type: 'number', width: '64px' },
                { label: '姓名', colspan: 1, field: '姓名', type: 'text', width: '100px' },
                { label: '身份信息', colspan: 2 },
                { label: '联系方式', colspan: 2 },
                { label: '年龄', colspan: 1, field: '年龄', type: 'number', width: '80px' },
                { label: '职位', colspan: 1, field: '职位', type: 'text', width: '120px' },
                { label: '薪资', colspan: 1, field: '薪资', type: 'currency', width: '100px' },
                { label: '学历', colspan: 1, field: '学历', type: 'text', width: '100px' },
                { label: '专业', colspan: 1, field: '专业', type: 'text', width: '120px' },
                { label: '入职日期', colspan: 1, field: '入职日期', type: 'date', width: '120px' }
            ],
            [
                { field: 'ID', label: 'ID', type: 'number', width: '64px' },
                { field: '姓名', label: '姓名', type: 'text', width: '100px' },
                { field: '身份证号', label: '身份证号', type: 'idcard', width: '180px' },
                { field: '出生日期', label: '出生日期', type: 'date', width: '120px' },
                { field: '手机号', label: '手机号', type: 'phone', width: '120px' },
                { field: '邮箱', label: '邮箱', type: 'email', width: '200px' },
                { field: '年龄', label: '年龄', type: 'number', width: '80px' },
                { field: '职位', label: '职位', type: 'text', width: '120px' },
                { field: '薪资', label: '薪资', type: 'currency', width: '100px' },
                { field: '学历', label: '学历', type: 'text', width: '100px' },
                { field: '专业', label: '专业', type: 'text', width: '120px' },
                { field: '入职日期', label: '入职日期', type: 'date', width: '120px' }
            ]
        ];

        // 所有可用的提示列字段（与数据源字段名一致）
        var HINT_FIELDS = ['ID', '姓名', '性别', '手机号', '身份证号', '邮箱', '年龄', '职位', '薪资'];

        /**
         * 获取指定容器中所有勾选的 checkbox 值
         */
        function getCheckboxValues(containerId) {
            var container = document.getElementById(containerId);
            if (!container) return [];
            var values = [];
            var cbs = container.querySelectorAll('input[type="checkbox"]:checked');
            for (var i = 0; i < cbs.length; i++) {
                values.push(cbs[i].value);
            }
            return values;
        }

        /**
         * 构建表头 thead HTML
         */
        function buildThead() {
            var multiHeader = document.getElementById('display-multi-header').checked;
            var html = '<thead>';

            if (multiHeader) {
                // 第一行：分组标题
                html += '<tr>';
                for (var i = 0; i < MULTI_HEADER_ROWS[0].length; i++) {
                    var col = MULTI_HEADER_ROWS[0][i];
                    var attrs = '';
                    if (col.colspan > 1) attrs += ' colspan="' + col.colspan + '"';
                    if (col.width) attrs += ' style="width: ' + col.width + ';"';
                    if (col.field) {
                        attrs += ' data-CUI-field="' + col.field + '"';
                        attrs += ' data-CUI-type="' + col.type + '"';
                        if (col.field === '年龄') attrs += ' data-CUI-summary="avg"';
                        if (col.field === '薪资') attrs += ' data-CUI-summary="sum"';
                    }
                    html += '<th' + attrs + '>' + col.label + '</th>';
                }
                html += '</tr>';

                // 第二行：数据字段
                html += '<tr>';
                for (var j = 0; j < MULTI_HEADER_ROWS[1].length; j++) {
                    var col2 = MULTI_HEADER_ROWS[1][j];
                    var attrs2 = ' data-CUI-field="' + col2.field + '"';
                    attrs2 += ' data-CUI-type="' + col2.type + '"';
                    if (col2.width) attrs2 += ' style="width: ' + col2.width + ';"';
                    if (col2.field === '年龄') attrs2 += ' data-CUI-summary="avg"';
                    if (col2.field === '薪资') attrs2 += ' data-CUI-summary="sum"';
                    html += '<th' + attrs2 + '>' + col2.label + '</th>';
                }
                html += '</tr>';
            } else {
                // 单级表头
                html += '<tr>';
                for (var k = 0; k < SINGLE_HEADER_COLS.length; k++) {
                    var col3 = SINGLE_HEADER_COLS[k];
                    var attrs3 = ' data-CUI-field="' + col3.field + '"';
                    attrs3 += ' data-CUI-type="' + col3.type + '"';
                    attrs3 += ' style="width: ' + col3.width + ';"';
                    if (col3.field === '年龄') attrs3 += ' data-CUI-summary="avg"';
                    if (col3.field === '薪资') attrs3 += ' data-CUI-summary="sum"';
                    html += '<th' + attrs3 + '>' + col3.label + '</th>';
                }
                html += '</tr>';
            }

            html += '</thead>';
            return html;
        }

        /**
         * 计算列数（用于 tfoot 的 colspan）
         */
        function getColumnCount() {
            var multiHeader = document.getElementById('display-multi-header').checked;
            if (multiHeader) {
                // 多级表头第二行就是数据字段行
                return MULTI_HEADER_ROWS[1].length;
            }
            return SINGLE_HEADER_COLS.length;
        }

        /**
         * 构建配置对象
         */
        function buildConfig() {
            var config = {
                dataSource: DATA_SOURCE,
                type: 'functional',
                pageSize: parseInt(document.getElementById('page-size').value, 10)
            };

            // 斑马纹
            if (document.getElementById('display-striped').checked) {
                config.striped = true;
            } else {
                config.striped = false;
            }

            // 冻结配置
            var freeze = {};

            if (document.getElementById('freeze-header').checked) {
                freeze.header = true;
            }

            if (document.getElementById('freeze-footer').checked) {
                freeze.footer = true;
            }

            // 左侧提示列（高级模式优先）
            if (document.getElementById('freeze-left-advanced').checked) {
                var leftFields = getCheckboxValues('left-hint-fields');
                if (leftFields.length > 0) {
                    freeze.left = leftFields;
                }
            } else if (document.getElementById('freeze-first-col').checked) {
                freeze.left = true;
            }

            // 右侧提示列（高级模式优先）
            if (document.getElementById('freeze-right-advanced').checked) {
                var rightFields = getCheckboxValues('right-hint-fields');
                if (rightFields.length > 0) {
                    freeze.right = rightFields;
                }
            } else if (document.getElementById('freeze-last-col').checked) {
                freeze.right = true;
            }

            // 提示列宽度
            var leftWidth = parseInt(document.getElementById('left-hint-width').value, 10);
            var rightWidth = parseInt(document.getElementById('right-hint-width').value, 10);
            if (leftWidth >= 40 && leftWidth <= 120) {
                freeze.leftWidth = leftWidth;
            }
            if (rightWidth >= 40 && rightWidth <= 120) {
                freeze.rightWidth = rightWidth;
            }

            if (Object.keys(freeze).length > 0) {
                config.freeze = freeze;
            }

            return config;
        }

        /**
         * 构建状态文本（用于调试显示）
         */
        function buildStatusText(config) {
            var parts = [];
            if (config.freeze) {
                if (config.freeze.header) parts.push('表头已冻结');
                if (config.freeze.footer) parts.push('表尾已冻结');
                if (config.freeze.left === true) parts.push('首列已冻结');
                if (Array.isArray(config.freeze.left)) parts.push('左侧提示列：' + config.freeze.left.join('、'));
                if (config.freeze.right === true) parts.push('尾列已冻结');
                if (Array.isArray(config.freeze.right)) parts.push('右侧提示列：' + config.freeze.right.join('、'));
            }
            if (config.striped) parts.push('斑马纹已启用');
            if (document.getElementById('display-editable').checked) parts.push('可编辑已启用');
            if (document.getElementById('display-summary').checked) parts.push('汇总已启用');
            if (document.getElementById('display-multi-header').checked) parts.push('多级表头');
            if (config.pageSize) parts.push('每页 ' + config.pageSize + ' 条');
            return parts.length > 0 ? parts.join(' | ') : '默认配置';
        }

        /**
         * 重建表格
         */
        function rebuildTable() {
            var config = buildConfig();
            var theadHtml = buildThead();
            var colCount = getColumnCount();
            var isMultiHeader = document.getElementById('display-multi-header').checked;
            var isEditable = document.getElementById('display-editable').checked;
            var isAutoRowHeight = document.getElementById('display-auto-row-height').checked;

            // 构建配置信息栏
            var tableHtml = '<div class="CUI-table-status-bar" style="margin-bottom: var(--size-sm); padding: var(--size-sm) var(--size-md); background: var(--bg-gray); border: 1px solid var(--border-color); border-radius: var(--radius-md);">';
            tableHtml += '<span class="CUI-badge CUI-badge-sm CUI-badge-primary">配置</span>';
            tableHtml += '<span style="margin-left: var(--size-xs);">' + buildStatusText(config) + '</span>';
            tableHtml += '</div>';

            // 构建表格容器
            tableHtml += '<div class="CUI-table-container">';

            // 构建表格标签
            tableHtml += '<table class="CUI-table';
            if (config.striped) tableHtml += ' CUI-table-striped';
            tableHtml += '"';
            tableHtml += ' id="demo-table"';
            tableHtml += ' data-CUI-dataTable="true"';
            tableHtml += ' data-CUI-config=\'' + JSON.stringify(config) + '\'>';

            // 表头
            tableHtml += theadHtml;

            // 表体
            tableHtml += '<tbody></tbody>';

            // 表尾（汇总行）
            if (document.getElementById('display-summary').checked) {
                tableHtml += '<tfoot><tr><td colspan="' + colCount + '">汇总</td></tr></tfoot>';
            } else {
                tableHtml += '<tfoot></tfoot>';
            }

            tableHtml += '</table></div>';

            // 替换表格区域
            var area = document.getElementById('table-area');
            area.innerHTML = tableHtml;

            // 如果是可编辑模式，在框架初始化后添加 contenteditable
            // 框架的 functional 类型会自动启用编辑，此处仅作标记
        }

        /**
         * 重置所有控件到默认值
         */
        function resetControls() {
            // 冻结设置
            document.getElementById('freeze-header').checked = true;
            document.getElementById('freeze-footer').checked = false;
            document.getElementById('freeze-first-col').checked = false;
            document.getElementById('freeze-last-col').checked = false;
            document.getElementById('freeze-left-advanced').checked = false;
            document.getElementById('freeze-right-advanced').checked = false;

            // 左侧提示列字段
            var leftCbs = document.querySelectorAll('#left-hint-fields input[type="checkbox"]');
            for (var i = 0; i < leftCbs.length; i++) {
                leftCbs[i].checked = false;
            }
            document.getElementById('left-hint-width').value = 80;

            // 右侧提示列字段
            var rightCbs = document.querySelectorAll('#right-hint-fields input[type="checkbox"]');
            for (var j = 0; j < rightCbs.length; j++) {
                rightCbs[j].checked = false;
            }
            document.getElementById('right-hint-width').value = 80;

            // 显示设置
            document.getElementById('display-striped').checked = true;
            document.getElementById('display-editable').checked = false;
            document.getElementById('display-multi-header').checked = false;
            document.getElementById('display-summary').checked = false;
            document.getElementById('display-auto-row-height').checked = false;

            // 分页设置
            document.getElementById('page-size').value = '50';

            // 重建表格
            rebuildTable();
        }

        /**
         * 初始化：页面加载完成后执行
         */
        function initPage() {
            // 初始渲染
            rebuildTable();

            // 应用设置按钮
            var btnApply = document.getElementById('btn-apply');
            if (btnApply) {
                btnApply.addEventListener('click', function () {
                    rebuildTable();
                });
            }

            // 重置按钮
            var btnReset = document.getElementById('btn-reset');
            if (btnReset) {
                btnReset.addEventListener('click', function () {
                    resetControls();
                });
            }

            // 高级模式复选框联动：选中高级模式时，自动取消简单模式
            var cbLeftAdvanced = document.getElementById('freeze-left-advanced');
            var cbFirstCol = document.getElementById('freeze-first-col');
            if (cbLeftAdvanced && cbFirstCol) {
                cbLeftAdvanced.addEventListener('change', function () {
                    if (this.checked) cbFirstCol.checked = false;
                });
                cbFirstCol.addEventListener('change', function () {
                    if (this.checked) cbLeftAdvanced.checked = false;
                });
            }

            var cbRightAdvanced = document.getElementById('freeze-right-advanced');
            var cbLastCol = document.getElementById('freeze-last-col');
            if (cbRightAdvanced && cbLastCol) {
                cbRightAdvanced.addEventListener('change', function () {
                    if (this.checked) cbLastCol.checked = false;
                });
                cbLastCol.addEventListener('change', function () {
                    if (this.checked) cbRightAdvanced.checked = false;
                });
            }
        }

        // DOM 就绪后执行
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
</body>
</html>
